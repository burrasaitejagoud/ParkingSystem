spring.application.name=ParkingSystem


spring.datasource.url = jdbc:mysql://localhost:3306/parkingsystem
spring.datasource.username = root
spring.datasource.password = Teja@143
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.int.mode=always


spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.generate.ddl = true


# Circuit breaker (Resilience4j) for API service calls.
# Only infrastructure failures (DB unreachable, timeouts) count towards opening the circuit;
# business errors such as "not found" or validation failures are ignored.
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.record-exceptions=org.springframework.dao.TransientDataAccessException,org.springframework.dao.RecoverableDataAccessException,org.springframework.dao.NonTransientDataAccessResourceException,org.springframework.transaction.CannotCreateTransactionException,java.util.concurrent.TimeoutException,java.io.IOException
resilience4j.circuitbreaker.instances.carService.base-config=default
resilience4j.circuitbreaker.instances.carEntryService.base-config=default
resilience4j.circuitbreaker.instances.observationService.base-config=default

management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
